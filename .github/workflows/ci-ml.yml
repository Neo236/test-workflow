# CI Data Science / ML — FastAPI (Python 3.10)
# Valida cada PR que modifica data-science/** antes de permitir el merge.
# Corre en el runner self-hosted de CI (servidor local, label: ci) —
# NO en la VM de producción.
name: CI ML

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "data-science/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: [self-hosted, ci]
    defaults:
      run:
        working-directory: data-science
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: data-science/requirements.txt

      - name: Instalar dependencias
        run: |
          # TODO: habilitar cuando se mergee la rama `data` (trae requirements.txt).
          # Al 24/07 data-science/ en develop solo contiene el Dockerfile.
          # pip install -r requirements.txt
          echo "PLACEHOLDER: pip install -r requirements.txt"

      - name: Lint
        run: |
          # TODO: definir linter con el equipo de Data Science (sugerido: ruff).
          # pip install ruff && ruff check src/
          echo "PLACEHOLDER: ruff check src/"

      - name: Tests
        run: |
          # TODO: habilitar cuando existan tests en data-science/tests/.
          # pytest tests/ -v
          echo "PLACEHOLDER: pytest tests/ (pendiente: crear suite de tests)"
