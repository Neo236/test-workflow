# CI Data Science / ML — FastAPI (Python 3.10)
# Valida cada PR que modifica data-science/** antes de permitir el merge.
# Corre en el runner self-hosted de CI (servidor local, label: ci) —
# NO en la VM de producción.
#
# ⚠️ No usamos actions/setup-python: en runners self-hosted solo funciona con
# Ubuntu (no publica builds para Debian — descubierto probando la réplica).
# En su lugar el job corre dentro del contenedor python:3.10-slim: la MISMA
# versión y base que el Dockerfile de producción, sin drift de toolchain.
# Requiere Docker en la máquina del runner (ya presente).
name: CI ML

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "data-science/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: [self-hosted, ci]
    container: python:3.10-slim
    defaults:
      run:
        working-directory: data-science
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          # TODO: habilitar cuando se mergee la rama `data` (trae requirements.txt).
          # pip install -r requirements.txt
          echo "PLACEHOLDER: pip install -r requirements.txt"

      - name: Lint
        run: |
          # TODO: definir linter con el equipo de Data Science (sugerido: ruff).
          # pip install ruff && ruff check src/
          echo "PLACEHOLDER: ruff check src/"

      - name: Tests
        run: |
          # TODO: habilitar cuando existan tests en data-science/tests/.
          # pytest tests/ -v
          echo "PLACEHOLDER: pytest tests/ (pendiente: crear suite de tests)"
