# CI Backend — Spring Boot (Java 17)
# Valida cada PR que modifica backend/** antes de permitir el merge.
# Corre en el runner self-hosted de CI (servidor local, label: ci) —
# NO en la VM de producción.
# Requiere: "Require approval for all outside collaborators" activado
# (Settings → Actions), porque este runner ejecuta el código del PR.
name: CI Backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, ci]
    defaults:
      run:
        working-directory: backend/analisis-energetico-api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/analisis-energetico-api/pom.xml

      - name: Build y tests
        run: |
          # mvnw está commiteado sin bit de ejecución (modo 100644 en git);
          # sin este chmod, un clone fresco falla con "Permission denied".
          # Fix definitivo en el repo (elimina esta línea):
          #   git update-index --chmod=+x backend/analisis-energetico-api/mvnw
          chmod +x mvnw
          ./mvnw -B verify
