# Deploy Completo — Stack EnergiAI
# Se dispara con merges que modifican docker-compose.yml
# (cambios de orquestación afectan a todos los servicios):
#   push a main    → PRODUCCIÓN (docker compose -p energiai-prod)
#   push a develop → STAGING    (docker compose -p energiai-staging)
name: Deploy Completo

on:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: deploy-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, oci]
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Re-desplegar stack completo
        run: |
          echo "🚀 Desplegando stack completo | entorno: $DEPLOY_ENV | rama: ${{ github.ref_name }} | commit: ${{ github.sha }}"
          # TODO: bloqueado por los mismos pendientes que deploy-backend.yml
          # (mvnw sin +x, imágenes Alpine sin arm64) y deploy-ml.yml
          # (requirements.txt ausente hasta mergear la rama `data`).
          # El comando final será:
          #   docker compose -p energiai-$DEPLOY_ENV --env-file .env.$DEPLOY_ENV up -d --build
          echo "PLACEHOLDER: docker compose -p energiai-$DEPLOY_ENV up -d --build"

      - name: Verificar salud del stack
        run: |
          # TODO: habilitar junto con los healthchecks individuales.
          #   docker compose -p energiai-$DEPLOY_ENV ps
          #   + curls a los puertos del ambiente correspondiente
          echo "PLACEHOLDER: docker compose -p energiai-$DEPLOY_ENV ps + healthchecks"
